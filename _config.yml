title: Charles Wiki
description: Personal knowledge base
remote_theme: just-the-docs/just-the-docs

# Enable search
search_enabled: true

# Use docs/ as a collection
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Sidebar navigation
just_the_docs:
  color_scheme: auto
  collections:
    docs:
      name: Documentation
      nav_exclude: false

# Default layout for all pages
defaults:
  - scope:
      path: ""
    values:
      layout: default
