title: Charles Wiki
description: Personal knowledge base
theme: just-the-docs

search_enabled: true

# Tell Jekyll that content lives in docs/
collections:
  docs:
    output: true
    permalink: /:path

# Sidebar navigation
just_the_docs:
  collections:
    docs:
      name: Documentation
      nav_exclude: false

# Default layout
defaults:
  - scope:
      path: ""
    values:
      layout: default
