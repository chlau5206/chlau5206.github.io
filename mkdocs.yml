site_name: Charles Wiki
site_description: Personal Knowledge Base
site_url: https://chlau.github.io

theme:
  name: material

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

  palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # - roamlinks      # Automatically converts [[Wikilinks]] to relative paths

markdown_extensions:

  - admonition
  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark              # Enables ==highlight==
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences       # Advanced code blocks & diagrams
  - pymdownx.details
  - pymdownx.callout           # Enables > [!NOTE] callouts

  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - toc:
      permalink: true